<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNESS STUDENT REGISTRATION FORM</title>
    <link rel="stylesheet" href="css/materialize.css">
</head>
<body>
    <header class="container">
        <h1 style="text-align: center; font-size: 40px; font-weight: bold; background-color: black; color: white; ">STUDENT REGISTRATION FORM</h1>
    </header>

    <main>
        <!-- PERSONAL DATA SECTION -->
        <section class="container">
            <span style="font-weight: bold;">1. PERSONAL DATA</span>
            <div class="container">
                <form>
                    <div class="row">
                        <div class="col s12 m3 l3">
                            <input type="text" id="surname">
                            <label for="surname">Surname</label>
                        </div>
                        <div class="col s12 m3 l3">
                            <input type="text" id="firstname">
                            <label for="firstname">First Name</label>
                        </div>
                        <div class="col s12 m3 l3">
                            <input type="text" id="othernames">
                            <label for="othernames">Other Names</label>
                        </div>
                        <div class="col s12 m3 l3">
                            <div class="file-field input-field">
                                <div class="btn">
                                    <span>Passport</span>
                                    <input type="file">
                                </div>
                                <div class="file-path-wrapper">
                                    <input class="file-path validate" type="text">
                                </div>
                            </div>
                        </div>

                        <div class="col s12 m6 l6 input-field">
                            <p>
                                <span>Gender</span>
                                <label>
                                    <input name="gender" type="radio" id="gender" value="Male"/>
                                    <span>Male</span>
                                    
                                </label>
                                <label>
                                    <input name="gender" type="radio" id="gender" value="Female"/>
                                    <span>Female</span>
                                    
                                </label>
                            </p>

                            <p>
                                <span>Marital Status</span>
                                <label>
                                    <input name="Status" type="radio" id="Status" value="single"/>
                                    <span>Single</span>
                                    
                                </label>
                                <label>
                                    <input name="Status" type="radio" id="Status" value="Married"/>
                                    <span>Married</span>
                                    
                                </label>
                                <label>
                                    <input name="Status" type="radio" id="Status" value="Other"/>
                                    <span>Other</span>
                                    
                                </label>
                            </p>
                        </div>

                        <div class="col s12 m6 l6">
                            <div>
                                <input type="text" id="state of origin">
                                <label for="state of origin">State of Origin</label>
                            </div>
                        </div>

                        <div class="col s12 m6 l6">
                            <div>
                                <input type="text" id="lga">
                                <label for="lga">L.G.A</label>
                            </div>
                        </div>

                        <div class="col s12 m12 l12">
                            <div>
                                <input type="text" id="address">
                                <label for="address">Address</label>
                            </div>
                        </div>
                            <div class="col s12 m4 l4">
                                <div>
                                    <input type="text" id="phone n0 1">
                                    <label for="phone n0 1">Phone No 1</label>
                                </div>
                            </div>
                            <div class="col s12 m4 l4">
                                <div>
                                    <input type="text" id="phone n0 2">
                                    <label for="phone n0 2">Phone No 2</label>
                                </div>
                            </div>
                            <div class="col s12 m4 l4">
                                <div>
                                    <input type="text" id="Email Address">
                                    <label for="Email Address">Email Address</label>
                                </div>
                            </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
<script src="./js/jquery.js"></script>
<script src="./js/materialize.js"></script>
<script>
    $(document).ready( ()=>{

    })
</script>
</html>
